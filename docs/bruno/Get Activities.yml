docs: |-
  # Get Activities API

  ## 1. Description

  Lấy danh sách các hoạt động của câu lạc bộ UHL Active. API hỗ trợ phân trang và tìm kiếm hoạt động theo từ khóa.

  ## 2. Method

  GET

  ## 3. Endpoint

  `/api/activities`

  ## 4. Request Parameters

  | Parameter | Type | Description |
  | --- | --- | --- |
  | page | number | Số trang cần lấy |
  | limit | number | Số lượng hoạt động trên mỗi trang |
  | q | string | Từ khóa tìm kiếm hoạt động |

  ## 5. Request Body

  Không có.

  ## 6. Success Response

  Status Code: `200 OK`

  ```
  {
    "data": [
      {
        "id": 12,
        "title": "Lễ vinh danh thủ lĩnh CLB và Dạ hội chào năm mới 2027",
        "description": "Tổng kết hoạt động phong trào sinh viên năm 2026 và trao bằng khen cho các cá nhân xuất sắc.",
        "location": "Sảnh chính Tòa nhà A",
        "start_at": "2026-12-30T11:30:00.000Z",
        "end_at": "2026-12-30T15:00:00.000Z",
        "capacity": 120,
        "created_by": 1,
        "created_at": "2026-10-20T08:00:00.000Z",
        "registered_count": 0,
        "remaining_seats": 120
      }
    ],
    "pagination": {
      "page": 1,
      "limit": 10,
      "total": 12,
      "totalPages": 2
    }
  }
  ```

  ## 7. Notes

  - API được sử dụng để hiển thị danh sách hoạt động của câu lạc bộ.
  - Hỗ trợ phân trang thông qua `page` và `limit`.
  - Hỗ trợ tìm kiếm hoạt động thông qua từ khóa `q`.
  - `registered_count`: Số lượng thành viên đã đăng ký.
  - `remaining_seats`: Số chỗ còn lại của hoạt động.

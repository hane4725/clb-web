docs: |-
  # Get Activity Detail API

  ## 1. Description

  Lấy thông tin chi tiết của một hoạt động cụ thể theo ID.

  ## 2. Method

  GET

  ## 3. Endpoint

  `/api/activities/:id`

  ## 4. Request Parameters

  | Parameter | Type | Description |
  | --- | --- | --- |
  | id | number | ID của hoạt động cần lấy thông tin |

  Ví dụ: `id = 12`

  ## 5. Request Body

  Không có.

  ## 6. Success Response

  Status Code: `200 OK`

  ```
  {
    "id": 12,
    "title": "Lễ vinh danh thủ lĩnh CLB và Dạ hội chào năm mới 2027",
    "description": "Tổng kết hoạt động phong trào sinh viên năm 2026 và trao bằng khen cho các cá nhân xuất sắc.",
    "location": "Sảnh chính Tòa nhà A",
    "start_at": "2026-12-30T11:30:00.000Z",
    "end_at": "2026-12-30T15:00:00.000Z",
    "capacity": 120,
    "created_by": 1,
    "created_at": "2026-10-20T08:00:00.000Z",
    "registered_count": 0,
    "remaining_seats": 120
  }
  ```

  ## 7. Notes

  - API được sử dụng để hiển thị thông tin chi tiết của một hoạt động.
  - Tham số `id` xác định hoạt động cần truy xuất.
  - `registered_count`: Số lượng thành viên đã đăng ký.
  - `remaining_seats`: Số chỗ còn lại của hoạt động.
  - Nếu không tìm thấy hoạt động tương ứng với ID, API có thể trả về lỗi `404 Not Found`.

docs: |-
  # Get Activity Registrations API

  ## 1. Description

  Lấy danh sách thành viên đã đăng ký tham gia một hoạt động của câu lạc bộ UHL Active.

  ## 2. Method

  GET

  ## 3. Endpoint

  `/api/activities/:id/registrations`

  ## 4. Request Parameters

  | Parameter | Type | Description |
  | --- | --- | --- |
  | id | number | ID của hoạt động cần xem danh sách đăng ký |

  ## 5. Request Body

  Không có.

  ## 6. Success Response

  Status Code: `200 OK` (cần kiểm tra Status Code thực tế trong Bruno)

  ```
  {
    "data": [
      {
        "id": 17,
        "created_at": "2026-11-05T04:22:36.000Z",
        "user_id": 1,
        "full_name": "Vũ Duy Sơn (Giảng viên / Admin)",
        "email": "admin@clb.test"
      }
    ]
  }
  ```

  ## 7. Notes

  - API được sử dụng để lấy danh sách thành viên đăng ký tham gia một hoạt động.
  - `id`: ID của hoạt động cần xem danh sách đăng ký.
  - `data`: Danh sách các bản ghi đăng ký.
  - `id` trong mỗi bản ghi: ID của bản ghi đăng ký.
  - `created_at`: Thời gian thành viên đăng ký.
  - `user_id`: ID của thành viên đăng ký.
  - `full_name`: Họ và tên thành viên.
  - `email`: Email của thành viên.

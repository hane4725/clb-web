docs: |-
  # Get My Registrations API

  ## 1. Description

  Lấy danh sách các hoạt động mà thành viên hiện tại đã đăng ký tham gia câu lạc bộ UHL Active.

  ## 2. Method

  GET

  ## 3. Endpoint

  `/api/registrations/me`

  ## 4. Request Headers

  | Name | Value | Description |
  | --- | --- | --- |
  | `X-User-Id` | `1` | ID của thành viên hiện tại |

  ## 5. Request Body

  Không có.

  ## 6. Success Response

  Status Code: `200 OK` (cần kiểm tra Status Code thực tế trong Bruno).

  ```
  {
    "data": [
      {
        "id": 12,
        "title": "Lễ vinh danh thủ lĩnh CLB và Dạ hội chào năm mới 2027",

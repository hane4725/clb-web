docs: |-
  # Register Activity - Full Capacity API

  ## 1. Description

  Kiểm tra trường hợp thành viên đăng ký tham gia một hoạt động đã đạt số lượng đăng ký tối đa.

  ## 2. Method

  POST

  ## 3. Endpoint

  `/api/activities/:id/registrations`

  ## 4. Request Parameters

  | Parameter | Type | Description |
  | --- | --- | --- |
  | `id` | number | ID của hoạt động cần đăng ký |

  ## 5. Request Headers

  | Name | Value | Description |
  | --- | --- | --- |
  | `X-User-Id` | `1` | ID của thành viên thực hiện đăng ký |

  ## 6. Request Body

  Không có.

  ## 7. Error Response

  Status Code: `409 Conflict`

  ```
  {
    "error": "Hoạt động đã hết chỗ"
  }
  ```

  ## 8. Notes

  - API được sử dụng để kiểm tra trường hợp hoạt động đã hết số lượng đăng ký.
  - Hoạt động có ID `10` đã đạt sức chứa tối đa.
  - Khi th
